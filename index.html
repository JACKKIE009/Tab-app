<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TAB Site Master</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/icon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:#f1f5f9;font-family:Inter,system-ui,sans-serif}
</style>
</head>
<body class="text-slate-800 antialiased min-h-screen pb-24 md:pb-6">

<header class="bg-slate-900 text-white sticky top-0 z-30">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <div>
      <h1 class="text-base font-bold">TAB Site Master</h1>
      <p class="text-[11px] text-slate-400">Testing &amp; Balancing Tracker</p>
    </div>
    <div class="hidden sm:flex gap-2 items-center">
      <button id="installBtn" class="hidden bg-emerald-600 hover:bg-emerald-500 px-3 py-1.5 rounded-lg text-xs font-medium">Install app</button>
      <button onclick="openModal()" class="bg-sky-600 hover:bg-sky-500 px-3 py-1.5 rounded-lg text-xs font-medium">+ Add tag</button>
      <button onclick="exportCSV()" class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-xs">Export CSV</button>
      <button onclick="resetData()" class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-lg text-xs">Reset</button>
    </div>
    <button onclick="resetData()" class="sm:hidden text-xs text-slate-400 p-2">Reset</button>
  </div>
</header>

<main class="max-w-6xl mx-auto px-3 sm:px-6 py-4 space-y-4">

  <section class="grid grid-cols-2 lg:grid-cols-4 gap-2.5">
    <div class="bg-white rounded-xl p-3 border border-slate-200"><p class="text-xs text-slate-500">Total units</p><p class="text-2xl font-bold" id="s-total">0</p></div>
    <div class="bg-white rounded-xl p-3 border border-slate-200"><p class="text-xs text-emerald-600">Completed</p><p class="text-2xl font-bold text-emerald-600" id="s-done">0</p></div>
    <div class="bg-white rounded-xl p-3 border border-slate-200"><p class="text-xs text-amber-600">Pending</p><p class="text-2xl font-bold text-amber-600" id="s-pend">0</p></div>
    <div class="bg-white rounded-xl p-3 border border-slate-200">
      <div class="flex justify-between text-xs text-slate-500"><span>Task completion</span><span id="s-ratio">0/0</span></div>
      <p class="text-2xl font-bold" id="s-pct">0%</p>
      <div class="h-2 bg-slate-100 rounded-full mt-1 overflow-hidden"><div id="s-bar" class="h-2 bg-sky-600 rounded-full transition-all" style="width:0%"></div></div>
    </div>
  </section>

  <section class="bg-white rounded-xl p-3 border border-slate-200 space-y-2">
    <div class="flex gap-1 bg-slate-100 p-1 rounded-lg text-xs" id="tabs">
      <button data-f="ALL" class="flex-1 py-1.5 rounded-md font-semibold">All (<span id="c-all">0</span>)</button>
      <button data-f="COMPLETED" class="flex-1 py-1.5 rounded-md font-semibold">Completed (<span id="c-done">0</span>)</button>
      <button data-f="PENDING" class="flex-1 py-1.5 rounded-md font-semibold">Pending (<span id="c-pend">0</span>)</button>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
      <input id="q" type="search" placeholder="Search tag, tech, floor, remarks" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm">
      <select id="f-sys" class="px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm">
        <option value="ALL">All systems</option><option value="AHU">AHU</option><option value="FCU">FCU</option>
        <option value="VAV">VAV box</option><option value="VCD">VCD</option><option value="PUMP">Chilled water pump</option><option value="DAMPER">Fire damper</option>
      </select>
      <select id="f-floor" class="px-2.5 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm"><option value="ALL">All floors</option></select>
    </div>
  </section>

  <section class="bg-white rounded-xl border border-slate-200 overflow-hidden">
    <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200 flex justify-between text-xs">
      <h2 class="font-semibold">Field checklist</h2>
      <span class="text-slate-500">Showing <b id="vis">0</b></span>
    </div>
    <div id="list" class="divide-y divide-slate-100"></div>
    <div id="empty" class="hidden py-10 text-center text-sm text-slate-500">
      No items match.
      <button onclick="clearFilters()" class="block mx-auto mt-2 text-sky-600 font-medium">Clear filters</button>
    </div>
  </section>
</main>

<div class="fixed bottom-0 inset-x-0 bg-slate-900 z-40 sm:hidden flex justify-around py-2" style="padding-bottom:calc(0.5rem + env(safe-area-inset-bottom,0px))">
  <button onclick="openModal()" class="text-white text-sm font-medium bg-sky-600 rounded-full px-5 py-2">+ Add tag</button>
  <button onclick="exportCSV()" class="text-slate-200 text-sm border border-slate-700 rounded-full px-5 py-2">Export</button>
</div>

<div id="modal" class="hidden fixed inset-0 bg-slate-900/60 z-50 flex items-end sm:items-center justify-center">
  <div class="bg-white w-full max-w-lg rounded-t-2xl sm:rounded-xl max-h-[90%] flex flex-col overflow-hidden">
    <div class="bg-slate-900 text-white px-5 py-3 flex justify-between items-center">
      <h3 class="font-bold text-sm" id="m-title">Add equipment tag</h3>
      <button onclick="closeModal()" class="text-xl leading-none px-1" aria-label="Close">&times;</button>
    </div>
    <form id="form" class="p-5 space-y-3 overflow-y-auto text-sm">
      <input type="hidden" id="f-id">
      <div class="grid grid-cols-2 gap-3">
        <label class="block text-xs font-semibold">Tag ID *<input id="f-tag" required placeholder="AHU-L02-01" class="mt-1 w-full px-2.5 py-2 border border-slate-300 rounded-lg uppercase font-normal"></label>
        <label class="block text-xs font-semibold">System *<select id="f-system" class="mt-1 w-full px-2.5 py-2 border border-slate-300 rounded-lg font-normal">
          <option value="AHU">AHU</option><option value="FCU">FCU</option><option value="VAV">VAV box</option><option value="VCD">VCD</option><option value="PUMP">Pump</option><option value="DAMPER">Fire damper</option>
        </select></label>
      </div>
      <div class="grid grid-cols-2 gap-3">
        <label class="block text-xs font-semibold">Floor / zone *<input id="f-fl" required placeholder="Level 2 - Zone A" class="mt-1 w-full px-2.5 py-2 border border-slate-300 rounded-lg font-normal"></label>
        <label class="block text-xs font-semibold">TAB tech *<input id="f-tech" required placeholder="Dave" class="mt-1 w-full px-2.5 py-2 border border-slate-300 rounded-lg font-normal"></label>
      </div>
      <div>
        <p class="text-xs font-semibold mb-1">Checklist tasks</p>
        <div id="f-tasks" class="grid grid-cols-2 gap-2 p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-xs"></div>
      </div>
      <label class="block text-xs font-semibold">Remarks<textarea id="f-rem" rows="2" class="mt-1 w-full px-2.5 py-2 border border-slate-300 rounded-lg font-normal"></textarea></label>
      <div class="flex gap-2 pt-1">
        <button type="submit" class="flex-1 bg-sky-600 text-white py-2.5 rounded-lg font-semibold">Save tag</button>
        <button type="button" onclick="closeModal()" class="px-4 border border-slate-300 rounded-lg">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
const TASKS = ['Airflow measured','Water/air balanced','Controls verified','Report signed'];
const KEY = 'tab-items-v1';
const today = () => new Date().toISOString().slice(0,10);
const SAMPLE = [
  {id:1,tag:'AHU-L01-01',system:'AHU',floor:'Level 1 - Plant',tech:'Dave',tasks:[1,1,1,1],remarks:'Passed at 98% design flow',updated:'2026-09-28'},
  {id:2,tag:'FCU-L02-07',system:'FCU',floor:'Level 2 - Zone A',tech:'Team A',tasks:[1,1,0,0],remarks:'Awaiting BMS point mapping',updated:'2026-10-01'},
  {id:3,tag:'VAV-L02-12',system:'VAV',floor:'Level 2 - Zone B',tech:'Maria',tasks:[1,0,0,0],remarks:'',updated:'2026-10-02'},
  {id:4,tag:'PUMP-CHW-01',system:'PUMP',floor:'Roof',tech:'Dave',tasks:[1,1,1,1],remarks:'Head and flow within 5%',updated:'2026-09-30'},
  {id:5,tag:'FD-L03-04',system:'DAMPER',floor:'Level 3 - Core',tech:'Sam',tasks:[0,0,0,0],remarks:'Access blocked by ceiling works',updated:'2026-10-03'}
];
let items = load(), filter = 'ALL';

function load(){ try{ const r=localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return JSON.parse(JSON.stringify(SAMPLE)); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){} }
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isDone = it => it.tasks.every(Boolean);

function floors(){
  const sel=$('f-floor'), cur=sel.value;
  const list=[...new Set(items.map(i=>i.floor))].sort();
  sel.innerHTML='<option value="ALL">All floors</option>'+list.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('');
  sel.value=list.includes(cur)?cur:'ALL';
}

function render(){
  floors();
  const q=$('q').value.toLowerCase(), sys=$('f-sys').value, fl=$('f-floor').value;
  const total=items.length, done=items.filter(isDone).length;
  const tTasks=total*TASKS.length, dTasks=items.reduce((a,i)=>a+i.tasks.filter(Boolean).length,0);
  const pct=tTasks?Math.round(dTasks/tTasks*100):0;
  $('s-total').textContent=total; $('s-done').textContent=done; $('s-pend').textContent=total-done;
  $('c-all').textContent=total; $('c-done').textContent=done; $('c-pend').textContent=total-done;
  $('s-pct').textContent=pct+'%'; $('s-ratio').textContent=dTasks+'/'+tTasks; $('s-bar').style.width=pct+'%';
  document.querySelectorAll('#tabs button').forEach(b=>{
    const on=b.dataset.f===filter;
    b.className='flex-1 py-1.5 rounded-md font-semibold '+(on?'bg-white shadow-sm text-slate-800':'text-slate-500');
  });
  const rows=items.filter(i=>{
    const d=isDone(i);
    if(filter==='COMPLETED'&&!d) return false;
    if(filter==='PENDING'&&d) return false;
    if(sys!=='ALL'&&i.system!==sys) return false;
    if(fl!=='ALL'&&i.floor!==fl) return false;
    return !q||[i.tag,i.tech,i.floor,i.remarks,i.system].join(' ').toLowerCase().includes(q);
  });
  $('vis').textContent=rows.length;
  $('empty').classList.toggle('hidden',rows.length>0);
  $('list').innerHTML=rows.map(i=>{
    const d=isDone(i), n=i.tasks.filter(Boolean).length;
    return `<article class="p-4">
      <div class="flex justify-between items-start gap-2">
        <div>
          <p class="font-bold text-sm">${esc(i.tag)} <span class="text-[11px] font-medium text-slate-500">${esc(i.system)}</span></p>
          <p class="text-xs text-slate-500">${esc(i.floor)} &middot; ${esc(i.tech)} &middot; ${esc(i.updated)}</p>
        </div>
        <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full ${d?'bg-emerald-50 text-emerald-700':'bg-amber-50 text-amber-700'}">${d?'Completed':'Pending '+n+'/'+TASKS.length}</span>
      </div>
      <div class="grid grid-cols-2 gap-x-3 gap-y-1.5 mt-3">
        ${TASKS.map((t,k)=>`<label class="flex items-center gap-2 text-xs py-1"><input type="checkbox" class="w-4 h-4 accent-sky-600" ${i.tasks[k]?'checked':''} onchange="toggleTask(${i.id},${k})">${t}</label>`).join('')}
      </div>
      ${i.remarks?`<p class="text-xs text-slate-600 bg-slate-50 rounded-lg px-3 py-2 mt-2">${esc(i.remarks)}</p>`:''}
      <div class="flex gap-4 mt-2 text-xs font-medium">
        <button onclick="openModal(${i.id})" class="text-sky-600 py-1">Edit</button>
        <button onclick="removeItem(${i.id})" class="text-red-600 py-1">Delete</button>
      </div>
    </article>`;
  }).join('');
}

function toggleTask(id,k){
  const it=items.find(x=>x.id===id); it.tasks[k]=it.tasks[k]?0:1; it.updated=today(); save(); render();
}
function removeItem(id){
  const it=items.find(x=>x.id===id);
  if(it&&confirm('Delete '+it.tag+'?')){ items=items.filter(x=>x.id!==id); save(); render(); }
}
function openModal(id){
  const it=id?items.find(x=>x.id===id):null;
  $('m-title').textContent=it?'Edit equipment tag':'Add equipment tag';
  $('f-id').value=it?it.id:''; $('f-tag').value=it?it.tag:''; $('f-system').value=it?it.system:'AHU';
  $('f-fl').value=it?it.floor:''; $('f-tech').value=it?it.tech:''; $('f-rem').value=it?it.remarks:'';
  $('f-tasks').innerHTML=TASKS.map((t,k)=>`<label class="flex items-center gap-2 py-1"><input type="checkbox" class="w-4 h-4 accent-sky-600" ${it&&it.tasks[k]?'checked':''}>${t}</label>`).join('');
  $('modal').classList.remove('hidden');
}
function closeModal(){ $('modal').classList.add('hidden'); }
$('form').addEventListener('submit',e=>{
  e.preventDefault();
  const tasks=[...document.querySelectorAll('#f-tasks input')].map(c=>c.checked?1:0);
  const data={tag:$('f-tag').value.trim().toUpperCase(),system:$('f-system').value,floor:$('f-fl').value.trim(),tech:$('f-tech').value.trim(),remarks:$('f-rem').value.trim(),tasks,updated:today()};
  const id=Number($('f-id').value);
  if(id) Object.assign(items.find(x=>x.id===id),data);
  else items.unshift({id:Date.now(),...data});
  save(); closeModal(); render();
});
function exportCSV(){
  const cell=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const head=['Tag','System','Floor','Tech','Status',...TASKS,'Updated','Remarks'];
  const lines=[head.map(cell).join(',')].concat(items.map(i=>[i.tag,i.system,i.floor,i.tech,isDone(i)?'Completed':'Pending',...i.tasks.map(t=>t?'Yes':'No'),i.updated,i.remarks].map(cell).join(',')));
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/csv'}));
  a.download='tab-report-'+today()+'.csv'; a.click();
}
function resetData(){ if(confirm('Reset to sample data? Your changes will be lost.')){ items=JSON.parse(JSON.stringify(SAMPLE)); save(); render(); } }
function clearFilters(){ filter='ALL'; $('q').value=''; $('f-sys').value='ALL'; $('f-floor').value='ALL'; render(); }
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render();});
$('q').addEventListener('input',render); $('f-sys').addEventListener('change',render); $('f-floor').addEventListener('change',render);

let deferredPrompt = null;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  deferredPrompt = event;
  installBtn.classList.remove('hidden');
});

installBtn.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  await deferredPrompt.userChoice;
  deferredPrompt = null;
  installBtn.classList.add('hidden');
});

window.addEventListener('appinstalled', () => {
  installBtn.classList.add('hidden');
});

render();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
